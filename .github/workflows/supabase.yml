name: Supabase

# Edge functions: deployed automatically when supabase/functions/** changes on main.
# Database migrations: MANUAL only (workflow_dispatch), dry-run by default.
#
# Why migrations aren't automatic: production data, and this repo has legacy
# migrations that share version prefixes (see scripts/ci/check-supabase-migrations.mjs),
# so a human should read the dry-run before anything is applied.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        required: true
        default: migrations-dry-run
        options:
          - migrations-dry-run
          - migrations-apply
          - functions-deploy

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  # Kept explicit (rather than read from supabase/config.toml) so the deploy
  # target is always a conscious choice, even though config.toml now agrees.
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

jobs:
  functions:
    name: Deploy edge functions
    if: >-
      (github.event_name == 'push' && vars.CD_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'functions-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Preflight
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN"; missing=1; }
          [ -n "$SUPABASE_PROJECT_ID" ]   || { echo "::error title=Missing variable::SUPABASE_PROJECT_ID (repo variable)"; missing=1; }
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: ./.github/actions/setup

      - name: Type-check before deploying
        run: bash scripts/ci/check-edge-functions.sh

      # supabase CLI comes from devDependencies (pinned by package-lock.json).
      # --use-api bundles server-side, so no Docker is needed.
      - name: Deploy all functions
        run: npx --no-install supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

  migrations:
    name: Database migrations
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'migrations-dry-run' || inputs.action == 'migrations-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create a separate "production-db" environment with required reviewers so
    # `migrations-apply` needs a second pair of eyes.
    environment:
      name: production-db
    steps:
      - name: Preflight
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ]  || { echo "::error title=Missing secret::SUPABASE_DB_PASSWORD"; missing=1; }
          [ -n "$SUPABASE_PROJECT_ID" ]   || { echo "::error title=Missing variable::SUPABASE_PROJECT_ID (repo variable)"; missing=1; }
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Migration naming check
        run: node scripts/ci/check-supabase-migrations.mjs

      - name: Link project
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry run (shows exactly what would be applied)
        run: npx --no-install supabase db push --dry-run

      - name: Apply migrations
        if: inputs.action == 'migrations-apply'
        run: npx --no-install supabase db push
