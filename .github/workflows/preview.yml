name: PR preview

# Uploads each PR as a *non-production* Worker version with a stable preview
# alias (pr-<number>) and comments the URL on the PR.
#
# ⚠️  OFF BY DEFAULT. Worker preview versions share the production bindings
#    (KV, D1, Queue, Supabase). Enable only if you're comfortable with that:
#    Settings → Variables → ENABLE_PR_PREVIEWS = true
# Fork PRs never run this (no access to secrets).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Upload preview version
    if: >-
      vars.ENABLE_PR_PREVIEWS == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/wrangler-output.ndjson
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Preflight
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error title=Missing secret::${v}"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/ci/export-build-env.mjs
      - run: npm run build

      - name: Upload preview version
        id: upload
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${GITHUB_SHA::7}"

      - name: Find preview URL
        id: url
        run: |
          url="$(node -e '
            const fs = require("fs");
            const f = process.env.WRANGLER_OUTPUT_FILE_PATH;
            if (!fs.existsSync(f)) process.exit(0);
            for (const l of fs.readFileSync(f, "utf8").split("\n").filter(Boolean)) {
              try { const j = JSON.parse(l); if (j.type === "version-upload" && j.preview_alias_url) console.log(j.preview_alias_url); } catch {}
            }' | tail -1)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const marker = '<!-- spark-labs-preview -->';
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### 🔍 Preview deployed',
              url ? `**${url}**` : '_Version uploaded; open the Cloudflare dashboard to find the preview URL._',
              '',
              `Commit \`${sha}\` · shares production bindings (KV/D1/Supabase) — please test carefully.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
