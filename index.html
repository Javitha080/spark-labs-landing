  <!-- Service Worker Registration with offline detection & update handling -->
  <script>
    if ('serviceWorker' in navigator) {
      // Detect local development mode
      const isDev = window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1' ||
        window.location.hostname === '[::1]' ||
        window.location.hostname.startsWith('192.168.') ||
        window.location.hostname.startsWith('10.') ||
        window.location.hostname.startsWith('172.16.') ||
        window.location.hostname.startsWith('172.17.') ||
        window.location.hostname.startsWith('172.18.') ||
        window.location.hostname.startsWith('172.19.') ||
        window.location.hostname.startsWith('172.20.') ||
        window.location.hostname.startsWith('172.21.') ||
        window.location.hostname.startsWith('172.22.') ||
        window.location.hostname.startsWith('172.23.') ||
        window.location.hostname.startsWith('172.24.') ||
        window.location.hostname.startsWith('172.25.') ||
        window.location.hostname.startsWith('172.26.') ||
        window.location.hostname.startsWith('172.27.') ||
        window.location.hostname.startsWith('172.28.') ||
        window.location.hostname.startsWith('172.29.') ||
        window.location.hostname.startsWith('172.30.') ||
        window.location.hostname.startsWith('172.31.') ||
        window.location.hostname.endsWith('.local');

      if (isDev) {
        // In local development, unregister any active service worker to prevent stale caching issues
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) {
                console.log('[SW] Active service worker unregistered for local development.');
              }
            });
          }
        }).catch((err) => {
          console.warn('[SW] Failed to get service worker registrations:', err);
        });
      } else {
        // Register the service worker for production
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              // Check for updates every 60 minutes
              setInterval(() => {
                reg.update().catch(() => { /* offline, skip */ });
              }, 60 * 60 * 1000);

              // Listen for new SW waiting to activate
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (!newWorker) return;

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New content available — notify user
                    window.dispatchEvent(new CustomEvent('sw-update-available'));
                  }
                });
              });

              // Listen for SW online/offline broadcasts
              navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'ONLINE_STATUS') {
                  const isOnline = event.data.payload.isOnline;
                  document.documentElement.classList.toggle('offline', !isOnline);
                  window.dispatchEvent(new CustomEvent('sw-online-status', {
                    detail: { isOnline }
                  }));
                }
              });
            })
            .catch(() => { /* SW registration failed, non-critical */ });

          // Auto-reload when a new SW takes control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });

        // Forward browser online/offline events to the SW
        window.addEventListener('online', () => {
          navigator.serviceWorker.controller?.postMessage({ type: 'CHECK_ONLINE' });
        });
        window.addEventListener('offline', () => {
          document.documentElement.classList.add('offline');
          window.dispatchEvent(new CustomEvent('sw-online-status', {
            detail: { isOnline: false }
          }));
        });
      }
    }
  </script>
